<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gann Time Machine V4 - High Precision Edition</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #151a23;
            --text-main: #e2e8f0;
            --border-color: #2d3748;
            --singularity-bg: #4a0000;
            --resonance-bg: #002b12;
            --cardinal-color: #ffd700;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            direction: ltr;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h2 { text-align: center; color: var(--cardinal-color); font-weight: 300; letter-spacing: 1px; }
        
        .input-group {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-box { flex: 1; display: flex; flex-direction: column; }
        .input-box label { margin-bottom: 8px; font-size: 0.9em; color: #a0aec0; }
        
        input[type="text"] {
            background-color: #0b0e14;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 1.1em;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus { border-color: var(--cardinal-color); }

        button {
            width: 100%;
            background: linear-gradient(135deg, #b8860b 0%, #ffd700 100%);
            color: #000;
            border: none;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .error-msg {
            color: #fc8181; background: #4a0000; padding: 10px;
            border-radius: 6px; display: none; margin-bottom: 15px; text-align: center;
        }

        table {
            width: 100%; border-collapse: collapse; margin-top: 25px;
            background-color: #0b0e14; border-radius: 8px; overflow: hidden;
        }

        th, td { padding: 14px; text-align: center; border-bottom: 1px solid var(--border-color); }
        th { background-color: #1a202c; color: #a0aec0; font-weight: normal; font-size: 0.9em; text-transform: uppercase; }
        
        /* Conditional Styling Classes */
        .row-singularity { background-color: var(--singularity-bg) !important; color: #fff; font-weight: bold; }
        .row-resonance { background-color: var(--resonance-bg) !important; color: #fff; }
        .text-cardinal { color: var(--cardinal-color); font-weight: bold; }
        .text-normal { color: var(--text-main); }
        
        .badge {
            padding: 4px 8px; border-radius: 4px; font-size: 0.8em; margin-right: 5px; background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GANN TIME MACHINE V4 <br><span style="font-size: 0.5em; color: #a0aec0;">HIGH-PRECISION CARDINAL EDITION</span></h2>
    
    <div class="input-group">
        <div class="input-box">
            <label>Swing High (Peak)</label>
            <input type="text" id="swing-hi" value="62848.41" inputmode="decimal">
        </div>
        <div class="input-box">
            <label>Swing Low (Trough)</label>
            <input type="text" id="swing-lo" value="60759.48" inputmode="decimal">
        </div>
    </div>

    <div id="error-msg" class="error-msg">Invalid inputs! Please enter valid numbers.</div>
    
    <button id="scan-btn">SCAN QUANTUM ORBITS</button>

    <table>
        <thead>
            <tr>
                <th>Price Target</th>
                <th>Orbit / Degrees</th>
                <th>Properties</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Data will be injected here -->
        </tbody>
    </table>
</div>

<script>
    window.onload = function() {
        processGann();
    };

    document.getElementById('scan-btn').addEventListener('click', processGann);

    // تبدیل اعداد فارسی به انگلیسی برای جلوگیری از خطای دکمه
    function toEnglishDigits(str) {
        const persianNumbers = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
        const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for (let i = 0; i < 10; i++) {
            str = str.replace(persianNumbers[i], i).replace(arabicNumbers[i], i);
        }
        return str;
    }

    // فرمت‌بندی هوشمند اعشار بر اساس بزرگی/کوچکی قیمت
    function formatPrice(price) {
        if (price < 0.000001) return price.toFixed(12);
        if (price < 0.001) return price.toFixed(10);
        if (price < 1) return price.toFixed(8);
        if (price < 1000) return price.toFixed(6);
        return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
    }

    function processGann() {
        // تغییر موقت متن دکمه برای فیدبک کلیک
        const btn = document.getElementById('scan-btn');
        btn.innerText = "SCANNING...";
        
        setTimeout(() => {
            let hi_val = document.getElementById('swing-hi').value.replace(/,/g, '').trim();
            let lo_val = document.getElementById('swing-lo').value.replace(/,/g, '').trim();
            
            hi_val = toEnglishDigits(hi_val);
            lo_val = toEnglishDigits(lo_val);
            
            const peak = parseFloat(hi_val);
            const trough = parseFloat(lo_val);
            const errorMsg = document.getElementById('error-msg');
            const tableBody = document.getElementById('table-body');

            tableBody.innerHTML = ''; 
            errorMsg.style.display = 'none';

            if (isNaN(peak) || isNaN(trough) || peak <= trough) {
                errorMsg.style.display = 'block';
                btn.innerText = "SCAN QUANTUM ORBITS";
                return;
            }

            // AUTO-SCALER برای حل مشکل کوین‌های ارزان مثل PEPE
            let scaleFactor = 1;
            let maxPrice = Math.max(peak, trough);
            if (maxPrice < 0.00001) scaleFactor = 10000000000;
            else if (maxPrice < 0.001) scaleFactor = 100000000;
            else if (maxPrice < 0.1) scaleFactor = 1000000;
            else if (maxPrice < 10) scaleFactor = 10000;
            else if (maxPrice < 100) scaleFactor = 100;

            let scaledPeak = peak * scaleFactor;
            let scaledTrough = trough * scaleFactor;

            // فیبوناچی روی قیمت واقعی انجام می‌شود (چون نسبتی است)
            const range = peak - trough;
            const fibLevels = [0.236, 0.382, 0.5, 0.618, 0.786, 1.272, 1.618, 2.618];
            let fibPrices = [];
            fibLevels.forEach(f => {
                fibPrices.push(trough + (range * f));
                fibPrices.push(peak - (range * f));
            });

            // تولید مدارهای چرخشی گان بر اساس قیمت اسکیل شده (ضریب‌دار)
            let targets = [];
            const degrees = [90, 180, 270, 360, 450, 540, 630, 720, 810, 900, 990, 1080, 1170, 1260, 1350, 1440];

            degrees.forEach(deg => {
                let upPriceScaled = Math.pow(Math.sqrt(scaledTrough) + (deg / 180), 2);
                let downPriceScaled = Math.pow(Math.sqrt(scaledPeak) - (deg / 180), 2);
                
                // برگرداندن قیمت به مقیاس واقعی قبل از پوش کردن
                targets.push({ price: upPriceScaled / scaleFactor, deg: deg, dir: 'Up' });
                targets.push({ price: downPriceScaled / scaleFactor, deg: deg, dir: 'Down' });
            });

            // کلاسترینگ (ادغام تارگت‌های نزدیک با تلورانس 0.15%)
            targets.sort((a, b) => b.price - a.price);
            let clusters = [];
            let currentCluster = [];

            for (let i = 0; i < targets.length; i++) {
                if (currentCluster.length === 0) {
                    currentCluster.push(targets[i]);
                } else {
                    let refPrice = currentCluster[0].price;
                    if (Math.abs(refPrice - targets[i].price) / refPrice <= 0.0015) {
                        currentCluster.push(targets[i]);
                    } else {
                        clusters.push(analyzeCluster(currentCluster, fibPrices));
                        currentCluster = [targets[i]];
                    }
                }
            }
            if (currentCluster.length > 0) {
                clusters.push(analyzeCluster(currentCluster, fibPrices));
            }

            // رندر جدول
            clusters.forEach(cluster => {
                let tr = document.createElement('tr');
                tr.className = cluster.rowClass;
                
                let priceClass = (cluster.rowClass === '') ? 'text-cardinal' : 'text-normal';

                tr.innerHTML = `
                    <td class="${priceClass}">$${formatPrice(cluster.price)}</td>
                    <td>${cluster.labels}</td>
                    <td>${cluster.badges}</td>
                `;
                tableBody.appendChild(tr);
            });

            btn.innerText = "SCAN QUANTUM ORBITS";
        }, 50);
    }

    function analyzeCluster(cluster, fibPrices) {
        let avgPrice = cluster.reduce((sum, t) => sum + t.price, 0) / cluster.length;
        
        let hasSingularity = cluster.some(t => t.deg === 1440);
        let isResonance = fibPrices.some(fib => Math.abs(avgPrice - fib) / fib <= 0.0015);

        let rowClass = '';
        let badges = '';

        if (hasSingularity) {
            rowClass = 'row-singularity';
            badges += '<span class="badge">Singularity (1440°)</span>';
        } else if (isResonance) {
            rowClass = 'row-resonance';
            badges += '<span class="badge">Fib Resonance</span>';
        } else {
            badges += '<span class="badge" style="color:var(--cardinal-color)">Cardinal Cross</span>';
        }

        let labels = cluster.map(t => `${t.dir} ${t.deg}°`).join(' & ');

        return { price: avgPrice, labels: labels, rowClass: rowClass, badges: badges };
    }
</script>

</body>
</html>
